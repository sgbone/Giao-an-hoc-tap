  questions: [
    { q: "Chuỗi ký tự (string) trong C thực chất là gì?", options: [
        "Một mảng các ký tự (char)",
        "Một số nguyên",
        "Một biến float" ],
      answer: 0, explain: "Chuỗi = mảng các ký tự xếp liền nhau." },

    { q: "Chuỗi trong C kết thúc bằng ký tự đặc biệt nào?", options: [
        "<code>'\\0'</code> (ký tự null)",
        "<code>'\\n'</code>",
        "Dấu cách" ],
      answer: 0, explain: "Ký tự kết thúc chuỗi là <code>'\\0'</code> (null)." },

    { q: "Khai báo <code>char s[100];</code> chứa được tối đa bao nhiêu ký tự?", options: [
        "99 ký tự (+ 1 ô cho '\\0')",
        "100 ký tự",
        "101 ký tự" ],
      answer: 0, explain: "1 ô dành cho ký tự kết thúc '\\0', nên còn 99 ký tự thật." },

    { q: "Lệnh nào nên dùng để nhập chuỗi CÓ khoảng trắng (vd họ tên)?", options: [
        "<code>fgets</code>",
        "<code>scanf(\"%s\", ...)</code>",
        "<code>printf</code>" ],
      answer: 0, explain: "<code>fgets</code> đọc cả dòng kể cả khoảng trắng." },

    { q: "Vì sao <code>scanf(\"%s\", s)</code> không đọc được \"Nguyen Van A\"?", options: [
        "Nó dừng khi gặp khoảng trắng",
        "Nó chỉ đọc số",
        "Nó đọc ngược" ],
      answer: 0, explain: "<code>%s</code> dừng ở khoảng trắng đầu tiên → chỉ lấy \"Nguyen\"." },

    { q: "Để dùng các hàm xử lý chuỗi, cần khai báo thư viện nào?", options: [

        "<code>#include &lt;math.h&gt;</code>",
        "<code>#include &lt;stdlib.h&gt;</code>" ],
      answer: 0, explain: "Các hàm strlen, strcpy… nằm trong <code>string.h</code>." },

    { q: "Hàm <code>strlen(s)</code> trả về gì?", options: [
        "Độ dài chuỗi (số ký tự)",

        "Bản sao chuỗi" ],
      answer: 0, explain: "<code>strlen</code> = string length → độ dài chuỗi." },

    { q: "Hàm <code>strcpy(dest, src)</code> làm gì?", options: [
        "Sao chép chuỗi src sang dest",
        "Nối hai chuỗi",
        "So sánh hai chuỗi" ],
      answer: 0, explain: "<code>strcpy</code> = string copy (chép src vào dest)." },

    { q: "Hàm <code>strcat(a, b)</code> làm gì?", options: [
        "Nối chuỗi b vào sau chuỗi a",
        "Xóa chuỗi b",
        "Đếm ký tự" ],
      answer: 0, explain: "<code>strcat</code> = concatenate (nối b vào cuối a)." },

    { q: "Hàm <code>strcmp(s1, s2)</code> trả về 0 khi nào?", options: [
        "Khi hai chuỗi GIỐNG hệt nhau",
        "Khi hai chuỗi khác nhau",
        "Luôn trả 0" ],
      answer: 0, explain: "<code>strcmp</code> trả 0 nếu hai chuỗi bằng nhau." },

    { q: "Sau <code>char a[100]=\"Hello, \"; strcat(a, \"World!\");</code> thì <code>a</code> là?", options: [

        "World!Hello, ",
        "Hello,World!" ],
      answer: 0, explain: "strcat nối \"World!\" vào sau \"Hello, \"." },

    { q: "Để duyệt từng ký tự của chuỗi <code>s</code>, vòng lặp thường dùng?", options: [

        "<code>for (i = 1; i <= strlen(s); i++)</code>",

    { q: "Điều kiện nhận biết một ký tự <code>c</code> là CHỮ HOA?", options: [

        "<code>c >= 'a' && c <= 'z'</code>",
        "<code>c >= '0' && c <= '9'</code>" ],

        "<code>if (s[i] == 0) dem++;</code>" ],
      answer: 0, explain: "So sánh ký tự với dấu cách <code>' '</code>." }
